        kvBytesPerToken: 114688
        decodeMsPerContextToken: 0
      rbln:
        prefillFixedMs: 2.945595
        prefillMsPerToken: 0.082988
        fullFixedMs: 6.97708
        decodeMsPerToken: 8.95924
