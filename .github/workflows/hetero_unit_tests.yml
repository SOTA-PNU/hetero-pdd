name: Hetero unit tests
"on":
  workflow_dispatch:
  push:
    paths: ['tools/hetero/**', 'tests/hetero/**']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.10'
      - name: Install test and lint dependencies
        run: python -m pip install prometheus-client==0.22.1 PyYAML==6.0.3 pre-commit==4.6.2
      - name: Unit tests (hardware and tools tests skip when unset)
        run: python -m unittest discover -s tests/hetero
      - name: Pre-commit on added and changed files
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          base="$BEFORE"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree --stdin </dev/null)
          fi
          mapfile -d '' -t files < <(git diff --name-only --diff-filter=ACMR -z "$base" HEAD)
          if ((${#files[@]})); then
            pre-commit run --files "${files[@]}"
          fi
