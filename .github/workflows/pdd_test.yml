name: PDD Test

on:
  push:
    branches:
      - main
      - feat/pdd-scheduling-llmd 
    paths-ignore:
      - 'experiments/*.yaml'
      - 'experiments/*.yml'
  workflow_dispatch:

concurrency:
  group: pdd-test
  cancel-in-progress: false

env:
  PDD_CONTAINER: pdd-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build-image:
    name: Build Docker image
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Remove stale PDD containers
        run: docker ps -aq --filter 'name=^pdd-' | xargs -r docker rm -f

      - name: Build PDD image
        run: |
          docker build \
            --build-context wheels=/opt/wheels \
            --label hetero-pdd=1 \
            -f docker/Dockerfile \
            -t hetero-pdd .

      - name: Remove untagged PDD images
        run: docker image prune -f --filter label=hetero-pdd=1

  prepare-run:
    name: Prepare run
    needs: build-image
    runs-on: self-hosted
    outputs:
      result_dir: ${{ steps.result-dir.outputs.result_dir }}
    steps:
      - name: Allocate result directory
        id: result-dir
        run: |
          result_root="$HOME/pdd-profile-results"
          result_dir="$result_root/native-dtype-gh${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p -- "$result_root"
          echo "result_dir=$result_dir" >> "$GITHUB_OUTPUT"

      - name: Start PDD container
        env:
          RESULT_DIR: ${{ steps.result-dir.outputs.result_dir }}
        run: |
          result_root=$(dirname -- "$RESULT_DIR")
          model_cache="$HOME/.cache/huggingface"
          mkdir -p -- "$model_cache"
          docker run --rm --init -d \
            --name "$PDD_CONTAINER" \
            --gpus all \
            --device rebellions.ai/npu=all \
            --network host \
            --ipc host \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$result_root,dst=$result_root" \
            --mount "type=bind,src=$model_cache,dst=/tmp/pdd-home/hf-cache" \
            -e USER="$(id -un)" \
            -e LOGNAME="$(id -un)" \
            -e RESULT_ROOT="$result_root" \
            -e RESULT_DIR \
            -e HF_HOME=/tmp/pdd-home/hf-cache \
            hetero-pdd sleep infinity

      - name: Prepare run
        run: |
          docker exec "$PDD_CONTAINER" bash -lc \
            'source ./profile_tools_env.sh && "$CUDA_PY" -c "from huggingface_hub import snapshot_download; snapshot_download(\"Qwen/Qwen3-0.6B\")" && ./prepare_run.sh'

  start-prefill:
    name: Start prefill
    needs: prepare-run
    runs-on: self-hosted
    steps:
      - name: Start prefill
        run: docker exec "$PDD_CONTAINER" ./start_prefill.sh

  start-decode:
    name: Start decode
    needs: start-prefill
    runs-on: self-hosted
    steps:
      - name: Start decode
        run: docker exec "$PDD_CONTAINER" ./start_decode.sh

  start-proxy:
    name: Start proxy
    needs: start-decode
    runs-on: self-hosted
    steps:
      - name: Start proxy
        run: |
          docker exec "$PDD_CONTAINER" bash -lc \
            'source ./profile_tools_env.sh && ./start_proxy.sh'

  check-correctness:
    name: Check correctness
    needs: start-proxy
    runs-on: self-hosted
    steps:
      - name: Check correctness
        run: docker exec "$PDD_CONTAINER" ./check_correctness.sh

  warmup:
    name: Warmup
    needs: check-correctness
    runs-on: self-hosted
    steps:
      - name: Warmup
        run: docker exec "$PDD_CONTAINER" ./warmup.sh

  run-workload:
    name: Run workload
    needs: warmup
    runs-on: self-hosted
    steps:
      - name: Run workload
        run: docker exec "$PDD_CONTAINER" ./run_workload.sh --phase measure

  stop-pdd:
    name: Stop PDD
    needs: [prepare-run, run-workload]
    if: ${{ always() && needs.prepare-run.outputs.result_dir != '' }}
    runs-on: self-hosted
    steps:
      - name: Stop PDD
        run: |
          if [[ "$(docker inspect -f '{{.State.Running}}' "$PDD_CONTAINER" 2>/dev/null)" == true ]]; then
            docker exec "$PDD_CONTAINER" bash -lc \
              'source ./profile_tools_env.sh && ./stop_pdd.sh'
          fi

  summarize-results:
    name: Summarize results
    needs:
      - prepare-run
      - stop-pdd
    if: ${{ always() && needs.prepare-run.outputs.result_dir != '' }}
    runs-on: self-hosted
    env:
      RESULT_DIR: ${{ needs.prepare-run.outputs.result_dir }}
    steps:
      - name: Summarize results
        run: |
          docker exec "$PDD_CONTAINER" bash -lc \
            'source ./profile_tools_env.sh && ./summarize_results.sh'
          cat "$RESULT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove PDD container
        if: ${{ always() }}
        run: |
          if docker container inspect "$PDD_CONTAINER" >/dev/null 2>&1; then
            docker rm -f "$PDD_CONTAINER"
          fi

      - name: Exclude empty artifact files
        if: ${{ always() }}
        id: empty
        run: |
          {
            echo "exclusions<<EMPTY_FILES"
            find "$RESULT_DIR" -type f -empty -printf '!%p\n'
            echo "EMPTY_FILES"
          } >> "$GITHUB_OUTPUT"

      - name: Upload PDD results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pdd-results-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            ${{ needs.prepare-run.outputs.result_dir }}/*.log
            ${{ needs.prepare-run.outputs.result_dir }}/*.env
            ${{ needs.prepare-run.outputs.result_dir }}/correctness*_response.json
            ${{ needs.prepare-run.outputs.result_dir }}/summary.*
            ${{ needs.prepare-run.outputs.result_dir }}/stages.json

            !${{ needs.prepare-run.outputs.result_dir }}/pids.env
            !${{ needs.prepare-run.outputs.result_dir }}/runtime.env
            ${{ steps.empty.outputs.exclusions }}

      - name: Prune old PDD results
        if: ${{ always() }}
        run: |
          cd "$(dirname -- "$RESULT_DIR")"
          # Directory names are generated above (native-dtype-gh<run>-<attempt>), so ls is safe.
          # shellcheck disable=SC2012
          ls -dt native-dtype-gh* | tail -n +6 | xargs -r rm -rf --
